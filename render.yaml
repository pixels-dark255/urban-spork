# Render Blueprint.
#
# This file must live at the REPOSITORY ROOT - Render only auto-detects a
# blueprint here. It used to sit in backend/, where Render never looked, so
# the service had to be wired up by hand in the dashboard instead.
#
# rootDir below is what makes the backend/ layout work: build and start
# commands run from there, while the blueprint itself stays at the root.
services:
  - type: web
    name: tickerboard
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      # The Python version lives in .python-version at the repo root, which
      # both Render and the GitHub runner read - one pin, one place. It
      # names the MINOR only (3.14), because pinning a patch pins it to the
      # images that happen to ship that patch: 3.14.3 existed on Ubuntu
      # 22.04/24.04 and not on 26.04, which broke the runner the day
      # ubuntu-latest moved. An unpinned interpreter is how psycopg2
      # silently stopped loading, so the minor still has to be pinned -
      # see backend/requirements.txt.
      #
      # A PYTHON_VERSION env var would override that file, so there is
      # deliberately none here.
      # Optional. Without it, news falls back to keyless Google News RSS.
      - key: NEWS_API_KEY
        sync: false
      # STRONGLY recommended. Without it the watchlist, intraday portfolios
      # and Strategy Arena are stored as JSON files under backend/data/,
      # which the free tier wipes on every redeploy AND every spin-down.
      # Point it at a free Postgres (supabase.com / neon.tech) and all three
      # stores persist. See README section 4.
      - key: DATABASE_URL
        sync: false
      # Scheduler cadence: watchlist predictions, intraday paper trading and
      # the Strategy Arena all tick on this interval.
      - key: TICK_MINUTES
        value: "5"
      # The Strategy Arena's simulation runs in a scheduled GitHub Actions
      # job, not here: a free instance woke into a multi-arena catch-up and
      # fell over, 503ing at market open. "github" makes this process a
      # read-only dashboard. "inprocess" restores the old behaviour.
      - key: ARENA_RUNNER
        value: "github"
